# Default values for API Management Service
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global configuration
global:
  environment: dev
  clusterDomain: cluster.local

# Application configuration
app:
  name: api-management-service
  version: "0.0.1-SNAPSHOT"
  description: "API Management Service for API key management, external API registration, rate limiting, and AI classification"

# Replica configuration
replicaCount: 2

# Image configuration
image:
  repository: your-registry/api-management-service
  tag: "latest"
  pullPolicy: IfNotPresent
  imagePullSecrets: []

# Name overrides
nameOverride: ""
fullnameOverride: ""

# Service Account configuration
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod configuration
podAnnotations: {}
podLabels: {}

# Security context
podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

# Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /api/v1/$2
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api-management.yourdomain.com
      paths:
        - path: /api/v1(/|$)(.*)
          pathType: Prefix
  tls:
    - secretName: api-management-tls
      hosts:
        - api-management.yourdomain.com

# Resource configuration - API Management Service는 중간 정도의 리소스가 필요
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# Health check probes - Spring Boot Actuator 기반
livenessProbe:
  httpGet:
    path: /api/v1/actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /api/v1/actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  httpGet:
    path: /api/v1/actuator/health/startup
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  successThreshold: 1

# Autoscaling configuration - API Gateway 성격으로 트래픽 변동이 큼
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15

# Environment variables
env:
  # Spring Boot configuration
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  
  # Database configuration
  DB_URL: "jdbc:mysql://mysql-service:3306/api_management_service_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8"
  DB_USERNAME: "apimanagement"
  DB_PASSWORD: ""
  
  # Redis configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  
  # Kafka configuration
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  
  # Auth0 configuration
  AUTH0_ISSUER_URI: "https://your-domain.auth0.com/"
  AUTH0_AUDIENCE: "https://api.yourservice.com"
  
  # Gemini AI configuration
  GEMINI_API_KEY: ""
  GEMINI_API_URL: "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent"
  
  # AWS configuration
  AWS_REGION: "ap-northeast-2"
  
  # ELK configuration
  ELK_ENABLED: "true"
  ELK_LOGSTASH_HOST: "logstash-service"
  ELK_ELASTICSEARCH_HOST: "elasticsearch-service"

# ConfigMap configuration
configMap:
  enabled: true
  data:
    application.yml: |
      spring:
        application:
          name: apimanagement
        profiles:
          active: ${SPRING_PROFILES_ACTIVE:prod}
        jpa:
          hibernate:
            ddl-auto: validate
        kafka:
          bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
        redis:
          host: ${REDIS_HOST}
          port: ${REDIS_PORT}
      management:
        endpoints:
          web:
            exposure:
              include: health,info,prometheus,metrics
        endpoint:
          health:
            show-details: when-authorized

# Secret configuration
secret:
  enabled: true
  data:
    DB_PASSWORD: ""
    GEMINI_API_KEY: ""
    AUTH0_CLIENT_SECRET: ""

# Volume configuration
volumes:
  - name: config-volume
    configMap:
      name: api-management-service-config
  - name: logs-volume
    emptyDir: {}

volumeMounts:
  - name: config-volume
    mountPath: /app/config
    readOnly: true
  - name: logs-volume
    mountPath: /app/logs

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity - API Management Service는 다른 서비스들과 함께 배치
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - api-management-service
          topologyKey: kubernetes.io/hostname

# Network policy
networkPolicy:
  enabled: true
  ingressRules:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egressRules:
    - to:
        - namespaceSelector:
            matchLabels:
              name: database
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - namespaceSelector:
            matchLabels:
              name: cache
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              name: messaging
      ports:
        - protocol: TCP
          port: 9092
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80

# Service monitor for Prometheus
serviceMonitor:
  enabled: true
  interval: 30s
  path: /api/v1/actuator/prometheus
  port: http

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Horizontal Pod Autoscaler
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
