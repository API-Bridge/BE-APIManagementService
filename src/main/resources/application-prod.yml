# 프로덕션 환경 설정
spring:
  profiles:
    active: prod
  
  # 프로덕션에서는 SQL 로그 비활성화
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  
  # 데이터베이스 설정 (프로덕션용 - 환경 변수에서 가져옴)
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  
  # Redis 설정 (프로덕션용)
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  
  # Kafka 설정 (프로덕션용)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}

# Gemini AI 설정 (프로덕션용 - 환경 변수에서 가져옴)
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent}
    timeout: ${GEMINI_TIMEOUT:30000}
